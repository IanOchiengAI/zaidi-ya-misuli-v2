<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Zaidi ya Misuli Resource Centre</title>
    <link rel="icon" type="image/png" href="rose-logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'brand-green': '#32CD32', 'brand-black': '#111111' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-white text-brand-black min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-white/95 backdrop-blur z-50 py-4 border-b border-gray-100">
        <div class="max-w-[90rem] mx-auto px-6 flex justify-between items-center">
            <a href="/" class="flex items-center gap-4 group">
                <img src="rose-logo.png" alt="Logo"
                    class="w-12 h-12 object-contain group-hover:scale-110 transition-transform">
                <h1
                    class="font-display font-extrabold text-2xl md:text-3xl tracking-tight text-brand-black leading-none">
                    Zaidi ya Misuli <br class="md:hidden">Resource Centre</h1>
            </a>
        </div>
    </nav>

    <!-- Success Content -->
    <main class="flex-1 flex items-center justify-center px-6 pt-24">
        <div class="text-center max-w-lg animate-fade-in-up">
            <!-- Success Icon -->
            <div
                class="w-24 h-24 bg-brand-green rounded-full flex items-center justify-center mx-auto mb-8 animate-pulse-glow">
                <i data-lucide="check" class="w-12 h-12 text-white"></i>
            </div>

            <h1 class="font-display font-bold text-4xl md:text-5xl mb-6 text-brand-black">
                Message Sent!
            </h1>

            <p class="text-xl text-gray-600 mb-10 leading-relaxed">
                Thank you for reaching out. We have received your message and will get back to you as soon as possible.
            </p>

            <a href="/"
                class="btn-glow inline-flex items-center gap-3 bg-brand-green text-white font-bold px-8 py-4 text-lg rounded-xl shadow-lg hover:bg-brand-green-dark transition-all duration-300">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-enhanced bg-brand-black text-white py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <p class="text-gray-400">&copy; 2025 Zaidi ya Misuli Resource Centre.</p>
        </div>
    </footer>

    <script src="main.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
